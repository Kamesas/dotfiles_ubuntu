# Global clangd config for PlatformIO / ESP32 projects. Covers every project,
# so projects need no .clangd file.
#
# compile_commands.json has GCC-only flags. clang rejects them with
# "Unknown argument" and then cannot find system headers like machine/endian.h.
# New "Unknown argument" warning: add the flag here, then :LspRestart.
CompileFlags:
  Remove:
    - -mlongcalls
    - -mtext-section-literals
    - -fno-tree-switch-conversion
    - -fstrict-volatile-bitfields
    - -freorder-blocks
    - -mfix-esp32-psram-cache-issue
